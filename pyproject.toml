[project]
name = "nfl-lab"
version = "0.1.0"
description = "Walk-forward NFL margin model, ledger vs closing lines, and live ESPN pick cards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=14",
  "scipy>=1.11",
]

[project.scripts]
nfl-lab = "nfl_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
