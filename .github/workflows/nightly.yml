name: nightly

# One command. Refresh data and the pick card, then commit JSON.
# A missing ESPN DraftKings line still fails the job. Captured lines are
# committed first, so one miss does not throw away the rest of the run.

on:
  schedule:
    # Morning refresh, US time, so a new week is ready before Thursday.
    - cron: "15 11 * * *"
    # Hourly on NFL days, from 12:15 UTC through 04:15 UTC.
    # 12:15 and 13:15 UTC sit inside the two-hour window for a 13:30 UTC
    # London kickoff. The old 16:15 start left that window empty (the 11:15
    # refresh is 15 minutes too early), which is how PHI-JAX was missed.
    - cron: "15 12-23,0-4 * * 0,1,4,5,6"
  workflow_dispatch:
    inputs:
      command:
        description: "refresh, pick-card, or line-snapshot"
        required: false
        default: refresh

permissions:
  contents: write

concurrency:
  group: nfl-lab-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Install
        run: uv sync --frozen --all-groups
      - name: Choose command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "15 11 * * *" ]; then
            CMD="refresh"
          else
            CMD="line-snapshot"
          fi
          case "$CMD" in
            refresh|pick-card|line-snapshot) ;;
            *) echo "unknown command: $CMD" >&2; exit 1 ;;
          esac
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
      - name: Run
        id: lab
        run: |
          set +e
          uv run nfl-lab ${{ steps.cmd.outputs.command }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      # Exit 2 means a partial snapshot was saved on purpose. Commit that, and
      # nothing else: a crash (exit 1) or a cancelled run must not push a
      # half-written public/api. The job still fails afterward.
      - name: Commit snapshots
        if: always() && (steps.lab.outputs.exit_code == '0' || steps.lab.outputs.exit_code == '2')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/api output/live
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "refresh: pick card and site JSON"
          # checkout leaves a detached HEAD, so name the branch explicitly.
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail when the command failed
        if: always() && steps.lab.outputs.exit_code != '0' && steps.lab.outputs.exit_code != ''
        run: exit 1
